name: Windows

on:
  push:
    branches: [windows]
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core:
    name: Core tests, CLI and smoke test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows -> target

      - name: Core tests
        run: cargo test -p spacesaver-core

      - name: Build CLI (release)
        run: cargo build --release -p spacesaver-cli

      - name: Seed real caches and two smoke projects
        run: |
          # A dormant and an active Node project inside the user profile.
          $smoke = Join-Path $env:USERPROFILE 'spacesaver-smoke'
          foreach ($name in 'old-app', 'new-app') {
            $root = Join-Path $smoke $name
            $pkg = Join-Path $root 'node_modules\left-pad'
            New-Item -ItemType Directory -Force -Path $pkg | Out-Null
            Set-Content -Path (Join-Path $root 'package.json') -Value '{ "name": "smoke", "version": "1.0.0" }'
            Set-Content -Path (Join-Path $root 'package-lock.json') -Value '{}'
            $f = [System.IO.File]::Create((Join-Path $pkg 'blob.bin')); $f.SetLength(3MB); $f.Close()
          }
          Get-ChildItem -File (Join-Path $smoke 'old-app') | ForEach-Object { $_.LastWriteTime = (Get-Date).AddDays(-90) }
          # Real package-manager caches in their default Windows locations.
          npm cache add typescript@5.6.3 --cache "$env:LOCALAPPDATA\npm-cache"
          python -m pip download --no-deps --only-binary=:all: -d "$env:RUNNER_TEMP\pipdl" numpy
          $nuget = Join-Path $env:RUNNER_TEMP 'nugetsmoke'
          dotnet new classlib -o $nuget --force | Out-Null
          dotnet add $nuget package Newtonsoft.Json --version 13.0.3 | Out-Null
          # Where the tools themselves say their caches are, to check SpaceSaver's paths.
          'pip cache dir:  ' + (python -m pip cache dir)
          dotnet nuget locals all --list
          "NUGET_PACKAGES: $env:NUGET_PACKAGES"
          exit 0

      - name: CLI smoke test
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $exe = (Resolve-Path 'target\release\spacesaver.exe').Path
          & $exe --version
          & $exe status
          if ($LASTEXITCODE -ne 0) { throw 'status failed' }

          $raw = & $exe scan --json
          if ($LASTEXITCODE -ne 0) { throw 'scan failed' }
          $scan = ($raw -join "`n") | ConvertFrom-Json
          "Scan: $($scan.items.Count) items in $($scan.durationMs) ms"
          '{0,-20} {1,12} {2,6} {3,15}' -f 'CATEGORY', 'SIZE', 'ITEMS', 'RECOMMENDED'
          foreach ($c in $scan.categories) {
            '{0,-20} {1,9:N1} MB {2,6} {3,12:N1} MB' -f $c.title, ($c.size / 1MB), $c.count, ($c.recommendedSize / 1MB)
          }
          ''
          'Items:'
          foreach ($i in $scan.items) {
            $flag = if ($i.recommended) { '*' } else { ' ' }
            $note = if ($i.blockedReason) { "  [blocked: $($i.blockedReason)]" } else { '' }
            '  {0} {1,-16} {2,9:N1} MB  {3,-7} {4}  {5}{6}' -f $flag, $i.category, ($i.size / 1MB), $i.risk, $i.title, $i.subtitle, $note
          }

          $caches = @($scan.items | Where-Object { $_.category -eq 'packageCaches' })
          if ($caches.Count -lt 1) { throw 'No package caches found' }
          foreach ($id in 'pkg.npm', 'pkg.pip', 'pkg.nuget.http') {
            if (-not ($scan.items | Where-Object { $_.id -eq $id })) { throw "Expected $id in the scan" }
          }
          $old = @($scan.items | Where-Object { $_.paths[0] -like '*spacesaver-smoke\old-app\node_modules' })
          $new = @($scan.items | Where-Object { $_.paths[0] -like '*spacesaver-smoke\new-app\node_modules' })
          if ($old.Count -ne 1 -or -not $old[0].recommended) { throw 'The dormant smoke project should be recommended' }
          if ($new.Count -ne 1 -or $new[0].recommended) { throw 'The active smoke project must not be recommended' }
          "Dormant project: $($old[0].tags -join ', ')"
          "Active project:  $($new[0].tags -join ', ')"

          ''
          & $exe scan -c projects
          & $exe scan -c wsl

          # Dry run: nothing moves.
          $nm = Join-Path $env:USERPROFILE 'spacesaver-smoke\old-app\node_modules'
          & $exe clean -c projects
          if (-not (Test-Path $nm)) { throw 'The dry run removed files' }

          # Real run on project artifacts only, then restore from the Recycle Bin.
          $report = (& $exe clean --yes -c projects --json) -join "`n" | ConvertFrom-Json
          "Items moved: $($report.items.Count), $([math]::Round($report.bytes / 1MB, 1)) MB. Errors: $($report.errors -join '; ')"
          if (Test-Path $nm) { throw 'node_modules was not moved to the Recycle Bin' }
          if (-not $report.entry) { throw 'No activity entry was written' }
          & $exe activity
          & $exe restore $report.entry.id
          if ($LASTEXITCODE -ne 0) { throw 'restore failed' }
          if (-not (Test-Path (Join-Path $nm 'left-pad\blob.bin'))) { throw 'Restore did not bring node_modules back' }
          & $exe status

      - uses: actions/upload-artifact@v7
        with:
          name: spacesaver-cli
          path: windows/target/release/spacesaver.exe
          if-no-files-found: error

  app:
    name: Desktop app (NSIS installer)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows/app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows -> target

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate icons from docs/assets/icon-512.png
        run: npx --yes @tauri-apps/cli@2 icon ../../docs/assets/icon-512.png -o icons

      - name: Build app and NSIS installer
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: List bundle
        run: Get-ChildItem ..\target\release\bundle -Recurse -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName }

      - uses: actions/upload-artifact@v7
        with:
          name: SpaceSaver-windows-setup
          path: windows/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Launch the built app on the runner's desktop and screenshot it. It scans the runner on
      # first launch. Best effort: a runner without an interactive desktop shouldn't fail the build.
      - name: Launch the app and take a screenshot
        continue-on-error: true
        run: |
          $exe = Get-ChildItem ..\target\release -Filter *.exe -File | Select-Object -First 1
          "Launching $($exe.FullName)"
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "The app exited with code $($app.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force -Path ..\target\screenshots | Out-Null
          $bmp.Save((Join-Path (Resolve-Path ..\target\screenshots) 'app.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          "Screen $($bounds.Width)x$($bounds.Height); app still running: $(-not $app.HasExited)"
          Stop-Process -Id $app.Id -Force

      - uses: actions/upload-artifact@v7
        with:
          name: app-screenshot
          path: windows/target/screenshots/*.png
          if-no-files-found: warn
