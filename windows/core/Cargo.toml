[package]
name = "spacesaver-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SpaceSaver for Windows: rules, scanner, safety guard, cleanup and activity log"
publish = false

[lib]
name = "spacesaver_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
] }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
junction = "1"
